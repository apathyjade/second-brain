# genimage：RV2 SD 卡镜像布局
# 用法：genimage --rootpath out --inputpath out --outputpath out --config configs/genimage.cfg
# 依赖 out/rootfs.ext4（由 Buildroot / Yocto 产出，见 RV2 根文件系统）
# 引导固件（FSBL/OpenSBI/U-Boot）在 SPI-NOR，不在本镜像内。

image rv2-sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
		size = 64M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}
}

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"Image",
			"k1-orangepi-rv2.dtb",
			"extlinux.conf"
		}
	}
	size = 64M
}
